name: CI

# The dashboard was the only Baraq repository without CI: 175 tests, a type
# check, a lint and a production build that nothing enforced on push. Every
# other repository already gates on its own suite, so a dashboard regression
# was the one kind that could reach a release branch unchallenged.

on:
  push:
    branches: [main, "release/**", "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Build-time configuration only. No secret is required to type-check,
      # lint, test or build this app, and none is referenced here: the
      # backend URL is public and the rest are display strings.
      BACKEND_API_URL: https://api.baraqapp.com/api/v1
      AUTH_COOKIE_SECURE: "true"
      DEPLOYMENT_ENVIRONMENT: ci
      NEXT_PUBLIC_APP_NAME: Baraq
      NEXT_PUBLIC_DEFAULT_LOCALE: ar
      NEXT_PUBLIC_DASHBOARD_VERSION: ci
      NEXT_PUBLIC_STUDENT_WEB_URL: https://web.baraqapp.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the source of
      # truth for a release build, and install would be free to drift from it.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes the contract suites that compare this app's endpoint list,
      # navigation sections and permissions against the backend's published
      # vocabulary. Those are the checks that catch a dashboard drifting away
      # from an API it no longer matches.
      - name: Test suite
        run: npm run test

      - name: Production build
        run: npm run build

      # `headers()` is resolved during the build and baked into
      # routes-manifest.json, so the built artifact is the only place the
      # CSP and HSTS the app really sends can be checked.
      - name: Verify shipped security headers
        run: npm run check:headers
